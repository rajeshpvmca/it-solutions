<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper py-5 px-3">
    <div class="auth-card" data-aos="zoom-in" data-aos-duration="1000">
        <div class="row g-0">
            
            <!-- Left Side: Image & Content -->
            <div class="col-lg-6 d-none d-lg-flex auth-image-side">
                <div data-aos="fade-right" data-aos-delay="300">
                    <h2 class="fw-bold mb-4">Welcome Back!</h2>
                    <p class="lead mb-4">Access your IT Dashboard to manage your solutions, cloud infrastructure, and team operations.</p>
                    <div class="d-flex align-items-center gap-3">
                        <i class="fa-solid fa-circle-check text-info"></i>
                        <span>Secure Access</span>
                    </div>
                    <div class="d-flex align-items-center gap-3 mt-2">
                        <i class="fa-solid fa-circle-check text-info"></i>
                        <span>Real-time Monitoring</span>
                    </div>
                </div>
            </div>

            <!-- Right Side: Form -->
            <div class="col-lg-6 auth-form-side">
                <a href="index.html" class="text-decoration-none small mb-3 d-inline-block text-muted">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Home
                </a>

                <h2 class="fw-bold mb-2">Login</h2>
                <p class="text-muted mb-4">Please enter your credentials.</p>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select id="loginRole" class="form-select" required>
                            <option value="">Select Role</option>
                            <option>Admin</option>
                            <option>Developer</option>
                            <option>Manager</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="name@company.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Remember Me</label>
                        </div>
                        <a href="#" class="text-primary text-decoration-none small">Forgot Password?</a>
                    </div>

                    <button class="btn btn-primary w-100 auth-btn mb-3">
                        Sign In
                    </button>
                </form>

                <p class="text-center mb-0">
                    Don't have account?
                    <a href="register.html" class="fw-bold text-decoration-none">Register Now</a>
                </p>
            </div>

        </div>
    </div>
</div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init();
</script>

<script src="js/auth.js"></script>

</body>
</html>
