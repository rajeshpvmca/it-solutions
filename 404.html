<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-wrapper text-white">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center" data-aos="zoom-in" data-aos-duration="1000">
            
            <div class="mb-4">
                <i class="fa-solid fa-circle-exclamation text-primary" style="font-size: 60px; opacity: 0.8;"></i>
            </div>

            <h1 class="error-number mb-2">404</h1>

            <h3 class="fw-bold mb-3">Oops! Resource Not Found</h3>

            <p class="text-muted lead mb-5">

            </p>

            <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                <a href="index.html" class="btn btn-outline-light px-4 py-2">
                    <i class="fa-solid fa-house me-2"></i> Go to Home
                </a>
                <a href="dashboard.html" class="btn btn-primary px-4 py-2">
                    <i class="fa-solid fa-gauge-high me-2"></i> Back to Dashboard
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init({ once: true });
</script>
</body>
</html>
