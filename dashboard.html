<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-wrapper">

    <!-- Preloader -->
    <div id="preloader">
        <div class="loader"></div>
        <div class="loader-text">Loading Dashboard...</div>
    </div>

<!-- Navbar -->
<nav class="navbar navbar-dark sticky-top shadow-sm dashboard-navbar px-3 px-md-4" style="height: 70px;">
    <div class="container-fluid d-flex align-items-center justify-content-between p-0">
        <div class="d-flex align-items-center">
            <button class="navbar-toggler d-md-none me-2 border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
                <span class="navbar-toggler-icon"></span>
            </button>

            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-laptop-code text-primary"></i> 
                <span class="d-none d-sm-inline">IT Dashboard</span>
                <span class="d-inline d-sm-none">ITD</span>
            </a>
        </div>

        <div class="text-white d-flex align-items-center gap-2 gap-md-3">
            <div class="text-end">
                <span id="userName" class="fw-semibold" style="font-size: 0.9rem;"></span>
                <span class="d-none d-md-inline opacity-50"> | <span id="userEmail" class="small fw-normal opacity-75"></span></span>
            </div>

            <button class="btn btn-danger btn-sm d-flex align-items-center gap-2 px-2 px-md-3" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="d-none d-md-inline">Sign Out</span>
            </button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-lg-2 col-md-3 sidebar p-3 d-none d-md-block">
            <h5 class="mb-4">Menu</h5>
            <ul class="nav flex-column" id="sidebarMenu">
                <!-- Links loaded dynamically by JS -->
            </ul>
        </div>

        <!-- Mobile Sidebar (Offcanvas) -->
        <div class="offcanvas offcanvas-start bg-dark text-white d-md-none" tabindex="-1" id="sidebarOffcanvas">
            <div class="offcanvas-header border-bottom border-secondary">
                <h5 class="offcanvas-title">Menu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body p-0">
                <ul class="nav flex-column p-3" id="mobileMenu">
                    <!-- Links loaded dynamically by JS -->
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-lg-10 col-md-9 col-12 p-3 p-md-4">
            <div id="contentBox" class="card shadow border-0">
                <div class="card-body">

                    <h2>
                        Welcome,
                        <span id="dashboardName"></span>
                    </h2>

                    <p class="mt-3">
                        This is your dashboard.
                    </p>

                </div>
            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init();
</script>
<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            const preloader = document.getElementById('preloader');
            if(preloader) {
                preloader.style.opacity = '0';
                setTimeout(() => {
                    preloader.style.display = 'none';
                }, 500);
            }
        }, 2000);
    });
</script>
<script src="dashboard.js"></script>

</body>
</html>
