<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper py-5 px-3">
    <div class="auth-card" data-aos="zoom-in" data-aos-duration="1000">
        <div class="row g-0">
            
            <!-- Left Side: Form -->
            <div class="col-lg-6 p-lg-5 p-3">
                <a href="index.html" class="text-decoration-none small mb-3 d-inline-block text-muted">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Home
                </a>

                <h2 class="fw-bold mb-2">Create Account</h2>
                <p class="text-muted mb-4">Start your journey with our IT solutions.</p>

                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select id="role" class="form-select" required>
                            <option value="">Select Role</option>
                            <option>Admin</option>
                            <option>Developer</option>
                            <option>Manager</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                                <span class="input-group-text toggle-password" style="cursor: pointer;">
                                    <i class="fa-solid fa-eye"></i>
                                </span>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                                <span class="input-group-text toggle-password" style="cursor: pointer;">
                                    <i class="fa-solid fa-eye"></i>
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label small" for="terms">
                            I agree to the <a href="404.html" class="text-decoration-none">Terms & Conditions</a>
                        </label>
                    </div>

                    <button class="btn btn-primary w-100 auth-btn mb-3">
                        Sign Up
                    </button>
                </form>

                <p class="text-center mb-0">
                    Already have account?
                    <a href="index.html" class="fw-bold text-decoration-none">Login</a>
                </p>
            </div>

            <!-- Right Side: Image & Content -->
            <div class="col-lg-6 d-none d-lg-flex auth-image-side" style="background-image: linear-gradient(rgba(37, 99, 235, 0.8), rgba(17, 24, 39, 0.9)), url('assets/img/banner3.webp');">
                <div data-aos="fade-left" data-aos-delay="300">
                    <h2 class="fw-bold mb-4">Join Our Community</h2>
                    <p class="lead mb-4">Get access to the world's most advanced IT management dashboard and scale your business operations.</p>
                    <div class="d-flex align-items-center gap-3">
                        <i class="fa-solid fa-rocket text-info"></i>
                        <span>Fast Deployment</span>
                    </div>
                    <div class="d-flex align-items-center gap-3 mt-2">
                        <i class="fa-solid fa-shield-halved text-info"></i>
                        <span>Enterprise Security</span>
                    </div>
                    <div class="d-flex align-items-center gap-3 mt-2">
                        <i class="fa-solid fa-headset text-info"></i>
                        <span>24/7 Expert Support</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init();
</script>
<script src="js/auth.js"></script>

</body>
</html>
